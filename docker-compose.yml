services:
  postgres:
    image: postgres:16-alpine
    container_name: perseo-postgres
    environment:
      POSTGRES_DB: perseo_finance
      POSTGRES_USER: perseo
      POSTGRES_PASSWORD: perseo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - perseo_pg_data:/var/lib/postgresql/data

volumes:
  perseo_pg_data:
